[project] # Update all fields in this section
name = "gpha-climb-sars-cov2-lineage-line-list"
version = "1.1.0"
description = "Short description here"
authors = [{name = "Mike Brown", email = "michael.d.brown@ukhsa.gov.uk"}]
requires-python = ">=3.14.0"
dependencies = ["pandas", "pyyaml", "climb-onyx-client", "python-dateutil", "requests", "pango-aliasor", "paramiko", "Biopython"]

[tool.setuptools.dynamic]
version = {attr = "project_name_here.__version__"} # Add underscore separated repo name here

[project.optional-dependencies] # Dependencies for developers only - add more if required
dev = ["ruff>=0.4.10,<0.5", "pytest", "pre-commit"] 

[build-system] # Leave this section
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.scripts] # Update with main repo script here
run_linelist = "covid_linelist.run_linelist:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"covid_linelist.lib" = ["*.yaml"]

[tool.ruff.lint] # Lint rules to follow - add or delete if required
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # comprehesnions
    "C4",
    # pathlib
    "PTH",
]

ignore = ["E501"] # Lint rules to ignore - add or remove as required

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
